name: Playwright Tests

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Application URL under test'
        default: 'http://jupiter.cloud.planittesting.com'

jobs:
  test:
    name: e2e (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Install Playwright browsers
        run: mvn -B -q test-compile exec:java -e -Dexec.mainClass=com.microsoft.playwright.CLI -Dexec.args="install --with-deps ${{ matrix.browser }}" -Dexec.classpathScope=test

      - name: Run tests
        run: mvn -B test -Dbrowser=${{ matrix.browser }} -DbaseUrl=${{ github.event.inputs.base_url || 'http://jupiter.cloud.planittesting.com' }}

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-${{ matrix.browser }}
          path: target/surefire-reports/
          retention-days: 14
